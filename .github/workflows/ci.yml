name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Run the gitleaks binary directly: the gitleaks-action fails on a repo's first
      # push (it diffs against the root commit's non-existent parent).
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar xz -C "$RUNNER_TEMP" gitleaks
      - name: Scan full git history for secrets
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose .'
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx jest --ci
      - name: Web build (test mode, so journeys can open Premium screens)
        run: npx expo export --platform web --output-dir dist
        env:
          EXPO_PUBLIC_TEST_MODE: '1'
      - name: Journey tests (Chrome, phone viewport)
        run: npx playwright test e2e/journey.spec.ts e2e/arcade.spec.ts e2e/gems.spec.ts
        env:
          CI: '1'
